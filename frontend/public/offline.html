<!doctype html>
<html lang="es">
  <head>

    <meta name="theme-color" content="#82285f" />
    <title>Sin conexión · MultiCatálogo</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;

      h1{font-size:1.4rem;margin:.5rem 0}
      p{color:#475569;line-height:1.5}
      button{margin-top:16px;background:#82285f;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1rem;min-height:44px}
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size:3rem">📡</div>
      <h1>Sin conexión</h1>

      <button onclick="location.reload()">Reintentar</button>
    </div>
